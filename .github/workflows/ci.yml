# Runs on every push and pull request: typecheck, unit tests, builds,
# end-to-end API tests against real PostgreSQL + Redis, a dependency audit and Docker builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx -w @medcore/api prisma generate
      - run: npx -w @medcore/api prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:api
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1

  e2e:
    name: End-to-end API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medcore
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: medcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medcore -d medcore"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The test harness creates and resets "medcore_test" on this server.
      TEST_DATABASE_URL: postgresql://medcore:ci_only_password@localhost:5432/medcore_test?schema=public
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx -w @medcore/api prisma generate
      - name: Generate throwaway secrets for this run
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "OTP_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on known high/critical vulnerabilities in packages that ship to production.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: medcore-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: medcore-web:ci
          build-args: NEXT_PUBLIC_API_URL=https://api.example.com/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
